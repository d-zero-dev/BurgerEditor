name: Setup Yarn workspace
description: >-
  Checkout, set up Node.js, enable Corepack/Yarn v4, and install
  dependencies with caching. Shared by every job in test.yml so a future
  Node/action-version bump only needs to happen in one place.

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 26.8.1

    - name: Enable Corepack and setup Yarn v4
      shell: bash
      run: |
        corepack enable
        corepack prepare $(node -p "require('./package.json').packageManager") --activate
        yarn --version

    - name: Cache dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .yarn/cache
        key: yarn-cache-${{ hashFiles('yarn.lock') }}
        restore-keys: yarn-cache-

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable
