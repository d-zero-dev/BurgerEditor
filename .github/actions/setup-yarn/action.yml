name: Setup Yarn workspace
description: >-
  Set up Node.js, enable Corepack/Yarn v4, and install dependencies with
  caching. Shared by every job in test.yml so a future Node/action-version
  bump only needs to happen in one place. The caller must run
  actions/checkout itself first — a local composite action is resolved
  relative to the already-checked-out workspace, so it cannot contain the
  checkout step that makes it resolvable in the first place.

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.13.1

    # Node 25 and later do not ship Corepack, and neither does the Node of
    # actions/setup-node, so a container whose own Node has none (the
    # Playwright image since it moved to Node 26) leaves `corepack` missing.
    # The pin is read by a custom manager in renovate.json.
    - name: Install Corepack, enable it and setup Yarn v4
      shell: bash
      run: |
        npm install -g corepack@0.36.0
        corepack enable
        corepack prepare $(node -p "require('./package.json').packageManager") --activate
        yarn --version

    - name: Cache dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .yarn/cache
        key: yarn-cache-${{ hashFiles('yarn.lock') }}
        restore-keys: yarn-cache-

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable
