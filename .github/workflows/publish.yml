name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build
        run: yarn build
      - name: Determine dist-tag
        id: dist-tag
        run: |
          VERSION=$(node -e "console.log(require('./lerna.json').version)")
          MAJOR="${VERSION%%.*}"
          # The major on `latest` tells the current line from a maintenance
          # line. @burger-editor/client is the package both lines publish.
          LATEST_VERSION="$(npm view @burger-editor/client@latest version)" || {
            echo "::error::Could not read the version of the latest release of @burger-editor/client"
            exit 1
          }
          LATEST_MAJOR="${LATEST_VERSION%%.*}"
          if ! [[ "$LATEST_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read the major version of the latest release (got '$LATEST_VERSION')"
            exit 1
          fi
          if [[ "$VERSION" == *"-"* ]]; then
            # A prerelease dist-tag (alpha, beta, rc) belongs to the current
            # line. A maintenance line publishes stable releases only: its
            # prerelease would move the tag of the current line.
            if [[ "$MAJOR" -lt "$LATEST_MAJOR" ]]; then
              echo "::error::$VERSION is a prerelease of an older major (latest is $LATEST_MAJOR.x); a maintenance line publishes stable releases only"
              exit 1
            elif [[ "$VERSION" == *"-alpha"* ]]; then
              echo "tag=alpha" >> "$GITHUB_OUTPUT"
            elif [[ "$VERSION" == *"-beta"* ]]; then
              echo "tag=beta" >> "$GITHUB_OUTPUT"
            elif [[ "$VERSION" == *"-rc"* ]]; then
              echo "tag=rc" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Unknown prerelease tag in version: $VERSION"
              exit 1
            fi
          elif [[ "$MAJOR" -lt "$LATEST_MAJOR" ]]; then
            # A stable release of a maintenance line must not take `latest`
            # away from the current line: publish it under `v<major>`.
            echo "tag=v${MAJOR}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        # `from-package` (vs `from-git`): publishes only packages whose
        # current package.json version is NOT yet on the npm registry.
        # `from-git` re-attempts every package at the tag, which means a
        # partial-publish failure (e.g. sigstore transparency log 409 on
        # one package mid-batch) cannot be recovered by re-running — the
        # already-published packages re-trigger the 409 and abort the
        # whole job before the unpublished ones get their turn.
        run: npx lerna publish from-package --dist-tag ${{ steps.dist-tag.outputs.tag }} --yes
      - name: Update npm for dist-tag
        # `npm dist-tag` authenticates through Trusted Publishing from npm
        # 11.21.0 on, and the Node.js above ships npm 11.20.0. Only the step
        # below needs it, so the publish itself keeps the bundled npm. Drop
        # this step once the Node.js version ships npm 11.21.0 or later. The
        # version is pinned like every other dependency.
        run: npm install --global npm@11.21.2
      - name: Move latest for packages without a stable release
        # A prerelease is published under its own dist-tag, which leaves
        # `latest` of a package that never had a stable release on the first
        # version ever published. Move it to this version. Packages that have
        # a stable release (v3 has one) keep their `latest`. Each package needs
        # "Allow npm dist-tag" enabled in its Trusted Publisher settings on
        # npmjs.com. See scripts/follow-latest-dist-tag.mjs.
        run: node scripts/follow-latest-dist-tag.mjs
