name: Publish

# Rule 65: the merge of a Release PR into a publish branch publishes it. The
# command checks the Release PR, tags the merge commit as the Publish App,
# publishes with OIDC Trusted Publishing, verifies the registry, and for the
# current line brings main back to dev. A push that is not the merge of a
# Release PR publishes nothing. Tag pushes start nothing.
#
# Nothing runs `npm dist-tag` after the publish, on purpose. The only tag a
# version gets is the one `lerna publish --dist-tag` sets while publishing: the
# `distTag` of the line in .github/release-lines.json (v4 is published under
# `latest`, v3 under `v3-legacy`), or else the one the version decides. A first
# publish of a new package is the exception: npm gives `latest` to the first
# version ever published, whatever the tag. Moving a tag here would need "Allow
# npm dist-tag" in the Trusted Publisher settings of every package, which can
# only be set on npmjs.com, one package at a time (`npm trust` has no flag for
# it), and an npm of 11.21.0 or later, which is the only way for `npm dist-tag`
# to authenticate through Trusted Publishing. To move a tag by hand, see the
# `npm-publish` skill.
on:
  push:
    branches: [main, v3]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  checks: read
  issues: write
  pull-requests: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: publish-app
        with:
          client-id: ${{ vars.PUBLISH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBLISH_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn release-automation publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_APP_SLUG: ${{ vars.RELEASE_APP_SLUG }}
          PUBLISH_APP_TOKEN: ${{ steps.publish-app.outputs.token }}
          PUBLISH_APP_SLUG: ${{ vars.PUBLISH_APP_SLUG }}
