name: Test

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - uses: ./.github/actions/setup-yarn

      - name: Install CJK fonts
        # azure.archive.ubuntu.com への接続が一過性にタイムアウトし apt-get update が失敗することがあるためリトライする
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            apt-get update
            apt-get install -y --no-install-recommends fonts-noto-cjk
            rm -rf /var/lib/apt/lists/*

      - name: Verify React Compiler coverage
        # React Compilerはコンパイル対象外の判断を診断ログなしで下すことが
        # あるため、item Editorごとの期待コンパイル状態をコードで固定して
        # 検証する（scripts/check-react-compiler-coverage.mjs）
        run: yarn verify:react-compiler

      - name: Build
        run: yarn build

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Upload VR diff images on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vr-diff-images
          path: packages/@burger-editor/client/src/__tests__/vr/__snapshots__/**/*-diff.png

  # React Compilerを無効化した状態でも同じテストが通ることを確認する
  # （react.devの「両方のモードで実行する」推奨）。VRはコンパイラの
  # 有無に左右されないピクセル出力の検証なのでここでは対象外にする
  test-no-compiler:
    name: Test (BGE_NO_COMPILER=1)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      BGE_NO_COMPILER: '1'

    steps:
      - uses: ./.github/actions/setup-yarn

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test:no-compiler
