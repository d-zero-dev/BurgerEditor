name: Test

# The Minimum CI. A pull request into this line must pass the `ci-ok` and
# `lines-check` jobs below (the ruleset requires them). `merge_group` is here
# because `release-automation lines-check` requires every line to run the
# Minimum CI on it, though this line has no merge queue. `sync/**` is the
# branch that brings `main` back to `dev` after a release of the current line.
# The branches are defined in .github/release-lines.json, and
# `release-automation lines-check` fails when they differ.
on:
  pull_request:
    branches: [dev, v3, main]
  push:
    branches: ['sync/**']
  merge_group:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  commit-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn release-automation commit-check --base ${{ github.base_ref }}

  lines-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn release-automation lines-check

  # The checks the ruleset requires: `ci-ok` (and `lines-check`). Requiring this
  # job instead of the jobs it needs means a job can be added, renamed or
  # removed here without editing the ruleset. A new job has to be listed in
  # `needs` below, though: one that is not listed is not required by anything.
  # `if: always()` makes it report even when a job it needs failed or was
  # skipped; `commit-check` is skipped on `merge_group` and `push`, which is not
  # a failure.
  ci-ok:
    if: always()
    needs: [checks, commit-check]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
