name: Test

# The Minimum CI. `dev` takes pull requests only through its merge queue (a
# repository ruleset), and the queue requires the `ci-ok` job below. The same
# job is required on a pull request into the other lines. `merge_group` runs
# the whole suite on the queue's merge result before it reaches `dev`, so a
# push to `dev` would run the same suite on the same commit a third time and
# is not a trigger. `sync/**` is the branch that brings `main` back to `dev`
# after a release: the Minimum CI runs on it before it is pushed to `dev`.
# The branches are defined in .github/release-lines.json, and
# `release-automation lines-check` fails when they differ.
on:
  pull_request:
    branches: [dev, v3, main]
  push:
    branches: ['sync/**']
  merge_group:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  commit-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-yarn
      - run: yarn release-automation commit-check --base ${{ github.base_ref }}

  lines-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-yarn
      - run: yarn release-automation lines-check

  # The checks the rulesets require: `ci-ok` (and `lines-check`). Requiring this
  # job instead of the jobs it needs means a job can be added, renamed or
  # removed here without editing a ruleset. A new job has to be listed in
  # `needs` below, though: one that is not listed is not required by anything.
  # `if: always()` makes it report even when a job it needs failed or was
  # skipped; `commit-check` is skipped on `merge_group` and `push`, which is not
  # a failure.
  ci-ok:
    if: always()
    needs: [checks, commit-check]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
