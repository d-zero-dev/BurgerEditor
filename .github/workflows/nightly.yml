name: Nightly

# Rules 33-36: start the Full CI of each line once a day (a success on the same
# commit is reused), keep the release-blocker Issues in line with the results,
# open the end-of-support and age gate Issues, and audit the dependencies of
# every line. The schedule runs on the default branch, dev.
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Run the Full CI even where the same commit passed
        type: boolean
        default: false
  workflow_run:
    workflows: [Full CI]
    types: [completed]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  dispatch:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-yarn
      - run: yarn release-automation nightly-dispatch ${{ inputs.force && '--force' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-yarn
      - run: yarn release-automation nightly-report
        env:
          GITHUB_TOKEN: ${{ github.token }}

  lines:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.lines.outputs.branches }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-yarn
      - id: lines
        run: echo "branches=$(yarn --silent release-automation classify --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.stringify(JSON.parse(s).lines.map(l=>l.branch))))')" >> "$GITHUB_OUTPUT"

  audit:
    needs: lines
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.lines.outputs.branches) }}
    runs-on: ubuntu-latest
    steps:
      # The tools come from dev; the lockfile to audit comes from the line.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-yarn
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
          path: line
      # The exit code tells a clean audit (0) from a failed one; both print nothing.
      - id: audit
        run: |
          status=0
          yarn npm audit --all --recursive --json > ../audit.json || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
        working-directory: line
      - run: yarn release-automation audit-report --line ${{ matrix.branch }} --file audit.json --exit-code "${{ steps.audit.outputs.status }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
