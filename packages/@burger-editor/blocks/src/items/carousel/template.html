<div data-bge=":autoplay, :loop, per-view:style(--per-view), :arrows, :dots, :effect" data-bge-autoplay="false" data-bge-loop="false" data-bge-arrows="true" data-bge-dots="true" data-bge-effect="slide" style="--per-view: 1">
	<div data-bge-list tabindex="0">
		<figure data-bge=":style, :scale, :scale-type, :aspect-ratio, :slide-label" data-bge-slide-label="" data-bge-scale="100" data-bge-scale-type="container" data-bge-aspect-ratio="revert" style="--css-width: 100cqi; --object-fit: cover; --aspect-ratio: revert">
			<div data-bge=":node, :href, :target, :command">
				<picture>
					<source data-bge="sp-path:srcset, sp-media:media, sp-width:width, sp-height:height" />
					<img src="%sampleImagePath%" alt="サンプル画像" data-bge="path:src, :alt, :width, :height, :loading" width="400" height="300" loading="lazy" />
				</picture>
			</div>
			<figcaption data-bge="caption"></figcaption>
		</figure>
	</div>
</div>
