nodeLinker: node-modules
npmRegistryServer: 'https://registry.npmjs.org'
enableGlobalCache: true

# 依存パッケージの install / postinstall スクリプトを実行しない。
# サプライチェーン攻撃の主要経路（悪意ある postinstall による任意コード実行）を
# 塞ぐ。Yarn 4 では個別の allow-list ができないため全か無かの設定。
enableScripts: false

# `yarn add` でバージョンを固定する（`^` / `~` を付けない）。
# Renovate 側の `rangeStrategy: pin` と対になる設定で、片方だけだと手動追加と
# Renovate 更新でバージョン表記が混ざる。例外は公開パッケージの外部の
# dependencies / peerDependencies で、`^` の範囲で書く（`yarn add foo@^1.2.3`。
# 理由は CLAUDE.md の「依存関係の追加」）。
defaultSemverRangePrefix: ''

# npm publish 後 3 日経過していないパッケージを依存解決から除外する
# サプライチェーン保護。Renovate の minimumReleaseAge（3 days）と同じ値。
npmMinimalAgeGate: 3d
